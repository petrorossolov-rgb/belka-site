# Общие map и log_format для server-блоков belkascm (T15, ep05 T06). Файл из
# sites-enabled попадает в контекст http, где только и можно объявить map и log_format.
# log_format должен быть объявлен раньше access_log, который на него ссылается: имя
# belkascm-maps.conf в sites-enabled идёт раньше belkascm.ru.conf и
# staging.belkascm.ru.conf («-» < «.»), тест tests/infra-csp.test.ts это держит.
map $uri $belkascm_cache_control {
    ~^/_astro/  "public, max-age=31536000, immutable";
    default     "no-cache";
}

# Адрес посетителя без полного IP (ep05, принцип 4): у IPv4 последний октет — 0, у IPv6
# остаются первые три группы (сокращённая запись «::» внутри них тоже даёт не больше
# трёх групп). Всё прочее — «-», адрес не пишется. Имена групп — с префиксом belkascm_:
# переменные регулярок в map общие для всего http, в том числе для соседнего сайта.
# Правила проверяются по порядку; тест прогоняет эти строки в JS на образцах.
map $remote_addr $belkascm_anon_ip {
    "~^(?<belkascm_ip4>\d+\.\d+\.\d+)\.\d+$"                      $belkascm_ip4.0;
    "~*^(?<belkascm_ip6>[0-9a-f]+:[0-9a-f]+:[0-9a-f]+):"          $belkascm_ip6::;
    "~*^(?<belkascm_ip6s>[0-9a-f]*(:[0-9a-f]+)?)::"               $belkascm_ip6s::;
    default                                                        "-";
}

# Формат журнала доступа belkascm — combined, но вместо $remote_addr маска выше. Им
# пользуются все access_log belkascm (прод и стейджинг, HTTP и HTTPS).
log_format belkascm_anon '$belkascm_anon_ip - $remote_user [$time_local] "$request" '
                         '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
