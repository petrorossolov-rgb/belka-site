# staging.belkascm.ru — стейджинг, этап HTTP (T13).
# HTTPS, редирект http→https, basic auth и error_page — в T15.
server {
    listen 80;
    listen [::]:80;
    server_name staging.belkascm.ru;

    root /srv/belkascm/staging/current;
    index index.html;

    access_log /var/log/nginx/belkascm-staging.access.log;
    error_log /var/log/nginx/belkascm-staging.error.log;

    # Проверки certbot --webroot (T15).
    location /.well-known/acme-challenge/ {
        root /srv/belkascm/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri $uri/ =404;
    }
}
