# staging.belkascm.ru — стейджинг (T13 — HTTP, T15 — HTTPS).
# Закрыт паролем и не индексируется: X-Robots-Tag с always стоит на уровне server
# и уходит во всех ответах, включая 401. htpasswd — вне репозитория (infra/README.md).

server {
    listen 80;
    listen [::]:80;
    server_name staging.belkascm.ru;
    server_tokens off;

    access_log /var/log/nginx/belkascm-staging.access.log;
    error_log /var/log/nginx/belkascm-staging.error.log;

    add_header X-Robots-Tag "noindex, nofollow" always;

    location /.well-known/acme-challenge/ {
        root /srv/belkascm/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://staging.belkascm.ru$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name staging.belkascm.ru;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/staging.belkascm.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.belkascm.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /srv/belkascm/staging/current;
    index index.html;
    error_page 404 /404.html;

    access_log /var/log/nginx/belkascm-staging.access.log;
    error_log /var/log/nginx/belkascm-staging.error.log;

    auth_basic "staging";
    auth_basic_user_file /etc/nginx/belkascm-staging.htpasswd;

    add_header X-Robots-Tag "noindex, nofollow" always;
    include /etc/nginx/snippets/belkascm/security-headers.conf;
    include /etc/nginx/snippets/belkascm/static-cache.conf;

    location / {
        try_files $uri $uri/ =404;
    }
}
