# Catch-all (T13, решение владельца 2026-09-24): запросы по голому IP и доменам,
# которых на сервере нет, не попадают на чужой vhost — соединение закрывается (444).
# Семейства адресов — те же, что у соседнего vhost (log.md, T13).
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    access_log off;
    return 444;
}

# HTTPS с неизвестным SNI (или без него) — отказ в рукопожатии, а не сертификат
# соседнего сайта. Сертификат блоку не нужен (nginx ≥ 1.19.4). Поставлен до DNS
# belkascm.ru, раньше T15: иначе до выпуска наших сертификатов https://belkascm.ru
# показал бы чужой сертификат. http2 — как у соседа: параметр общий для адреса:порта.
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;

    access_log off;
    ssl_reject_handshake on;
}
