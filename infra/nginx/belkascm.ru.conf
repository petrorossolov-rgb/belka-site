# belkascm.ru и www.belkascm.ru — прод, этап HTTP (T13).
# HTTPS, редиректы http→https и www→apex, заголовки и error_page — в T15.
server {
    listen 80;
    listen [::]:80;
    server_name belkascm.ru www.belkascm.ru;

    root /srv/belkascm/prod/current;
    index index.html;

    access_log /var/log/nginx/belkascm.access.log;
    error_log /var/log/nginx/belkascm.error.log;

    # Проверки certbot --webroot (T15).
    location /.well-known/acme-challenge/ {
        root /srv/belkascm/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
