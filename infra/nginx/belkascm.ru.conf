# belkascm.ru и www.belkascm.ru — прод (T13 — HTTP, T15 — HTTPS).
# Все адреса ведут на https://belkascm.ru с сохранением пути; HTTP отвечает сам
# только на проверки certbot --webroot.
# Журналы — без полного IP (ep05 T06, принцип 4): access_log — формат belkascm_anon из
# belkascm-maps.conf, error_log — только crit (на уровне error nginx пишет «client: <IP>»).
# CSP — отдельный сниппет в каждом HTTPS-блоке: csp-strict.conf или csp-metrika.conf.

server {
    listen 80;
    listen [::]:80;
    server_name belkascm.ru www.belkascm.ru;
    server_tokens off;

    access_log /var/log/nginx/belkascm.access.log belkascm_anon;
    error_log /var/log/nginx/belkascm.error.log crit;

    location /.well-known/acme-challenge/ {
        root /srv/belkascm/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://belkascm.ru$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.belkascm.ru;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/belkascm.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/belkascm.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/belkascm.access.log belkascm_anon;
    error_log /var/log/nginx/belkascm.error.log crit;

    include /etc/nginx/snippets/belkascm/security-headers.conf;

    include /etc/nginx/snippets/belkascm/csp-strict.conf;

    return 301 https://belkascm.ru$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name belkascm.ru;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/belkascm.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/belkascm.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /srv/belkascm/prod/current;
    index index.html;
    error_page 404 /404.html;

    access_log /var/log/nginx/belkascm.access.log belkascm_anon;
    error_log /var/log/nginx/belkascm.error.log crit;

    include /etc/nginx/snippets/belkascm/security-headers.conf;

    include /etc/nginx/snippets/belkascm/csp-strict.conf;
    include /etc/nginx/snippets/belkascm/static-cache.conf;

    location / {
        try_files $uri $uri/ =404;
    }
}
