# CSP belkascm — «Метрика» (ep05 T06): флаг site.flags.metrikaEnabled включён. Строгая
# политика (csp-strict.conf) плюс только то, что нужно счётчику, подключённому внешним
# скриптом, без Вебвизора и карты кликов:
#   script-src  + https://mc.yandex.ru https://yastatic.net  (tag.js и его модули)
#   img-src     + https://mc.yandex.ru                       (пиксель)
#   connect-src 'self' https://mc.yandex.ru                  (отправка данных; 'self' — как
#                                                             было через default-src)
# Источник — справка Метрики «Установка счетчика на сайт с CSP», раздел «Подключение кода
# счетчика с помощью внешнего скрипта» (https://yandex.ru/support/metrica/code/install-counter-csp.html,
# сверено 2026-09-29). child-src, frame-src, blob: и wss:// справка требует только для
# Вебвизора, карт кликов, ссылок и скроллинга — у нас они выключены, поэтому их нет.
# 'unsafe-inline' в script-src нет: скрипт согласия — свой файл /js/consent.js.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://mc.yandex.ru; style-src 'self' 'unsafe-inline'; script-src 'self' https://mc.yandex.ru https://yastatic.net; connect-src 'self' https://mc.yandex.ru; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;
