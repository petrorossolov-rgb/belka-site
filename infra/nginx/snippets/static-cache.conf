# Кэш и сжатие статики belkascm (T15). Подключается на уровне server в HTTPS-блоках
# прода и стейджинга. Cache-Control выбирает map из belkascm-maps.conf по $uri:
# /_astro/* (имена с хешем) — год и immutable, остальное (HTML, robots, фавиконки,
# 404) — no-cache. Заголовок на уровне server, а не в location: так он не отменяет
# заголовки безопасности (security-headers.conf).
add_header Cache-Control $belkascm_cache_control always;

gzip on;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 256;
gzip_types text/css text/plain text/xml application/javascript application/json
           application/xml application/manifest+json image/svg+xml;
