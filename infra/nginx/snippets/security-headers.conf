# Заголовки безопасности belkascm (T15). Подключается на уровне server в каждом
# HTTPS-блоке. add_header в location отменяет унаследованные заголовки, поэтому
# в наших location своих add_header нет: Cache-Control тоже ставится на уровне
# server (static-cache.conf).
#
# HSTS — 300 секунд на старте, без includeSubDomains и preload; поднять до года
# после недели стабильной работы (follow-up). CSP здесь нет (ep05 T06): его ставит
# отдельный сниппет в том же server — csp-strict.conf (флаг Метрики выключен) или
# csp-metrika.conf (включён). Ставятся на сервер вместе с этим файлом, иначе окно без
# CSP (infra/README.md). interest-cohort (FLoC) не указан: технология
# снята, Chrome пишет о неизвестной функции ошибку в консоль (аудит Lighthouse).
add_header Strict-Transport-Security "max-age=300" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
