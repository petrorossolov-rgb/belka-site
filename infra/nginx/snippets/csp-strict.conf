# CSP belkascm — строгий (ep05 T06): сайт без клиентского JS, флаг Метрики выключен.
# Строка — дословно прежняя из security-headers.conf (T15, plan ep01 B6); тест
# tests/infra-csp.test.ts сверяет её побайтно. Каждый HTTPS-блок belkascm подключает на
# уровне server ровно один CSP-сниппет: этот или csp-metrika.conf. Какой — задаёт
# site.flags.metrikaEnabled, согласованность держит тот же тест (plan ep05 → Key Decision
# «CSP и флаг меняются одним PR»).
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;
