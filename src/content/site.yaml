# Глобальные настройки сайта. Одна запись `site` (лоадер `file`).
# nameRu — русская редакция имени, утверждена владельцем (Constitution 3); contacts, legal,
# metrika — пусто до ep05. seo — OG-карточка (npm run build:og) и её alt (утверждён 2026-09-26).
site:
  name: Belka SCM
  nameRu: Белка УЦП
  slogan: Знает, где что лежит.
  url: https://belkascm.ru
  contacts: {}
  legal: {}
  flags:
    legalEntityReady: false
    metrikaEnabled: false
    showReadiness: false
  metrika: {}
  seo:
    defaultOgImage: ../assets/og/default.png
    defaultOgImageAlt: "Знак Belka SCM и слоган «Знает, где что лежит.»"
  # Подпись о демо-данных у каждой фигуры мокапа (ep03), утверждена 2026-09-27 (texts/wms.md).
  mockupNote: "Демо-данные."
  # Подпись флажка паузы у фигуры вида со сценарием (ep04); утверждена 2026-09-27
  # (docs/ep04-product-packapp/log.md → «Утверждение текстов: packapp»).
  mockupPauseLabel: "Пауза"
  # Строки плашки согласия (ep05): выводятся только при site.flags.metrikaEnabled. Заглушки до T17
  # (пакет texts/privacy.md). consent.text — ровно consentTextMax, кнопки и ссылки — на своих
  # максимумах: проверка 6 check-consent доказывает, что лимиты совместимы с 360 × 800 (ревью F04).
  consent:
    title: "Заглушка ep05: заголовок плашки согласия на cookie"
    text: "Заглушка ep05: текст плашки согласия. Сайт спрашивает, можно ли включить счётчик посещаемости и сохранить cookie. Окончательный текст придёт из пакета privacy после утверждения. Здесь этот текст нужен, чтобы проверить, что плашка на узком экране остаётся не выше трети окна и не закрывает содержимое."
    allow: "Заглушка ep05: разрешить"
    deny: "Заглушка ep05: отклонить"
    settings: "Заглушка ep05: настройки"
    policyLink: "Заглушка ep05: политика обработки данных"
    consentLink: "Заглушка ep05: согласие на обработку ПДн"
    policyPage: privacy
    consentPage: consent
    version: 1
  # Подписи реквизитов (ep05): выводятся только рядом с заполненным site.legal. Заглушки до T17.
  legalLabels:
    inn: "Заглушка ep05: подпись ИНН в подвале"
    ogrn: "Заглушка ep05: подпись ОГРН в подвале"
    address: "Заглушка ep05: подпись адреса в подвале"
    operator: "Заглушка ep05: подпись оператора ПДн"
