# Глобальные настройки сайта. Одна запись `site` (лоадер `file`).
# nameRu — русская редакция имени, утверждена владельцем (Constitution 3); contacts, legal,
# metrika — пусто до ep05. seo — OG-карточка (npm run build:og); alt пока собран из имени и
# утверждённого слогана, финальный — перенос текстов ep02 (T18).
site:
  name: Belka SCM
  nameRu: Белка УЦП
  slogan: Знает, где что лежит.
  url: https://belkascm.ru
  contacts: {}
  legal: {}
  flags:
    legalEntityReady: false
    metrikaEnabled: false
    showReadiness: false
  metrika: {}
  seo:
    defaultOgImage: ../assets/og/default.png
    defaultOgImageAlt: Belka SCM. Знает, где что лежит.
