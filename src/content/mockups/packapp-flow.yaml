# Сценарий упаковщика Belka PackApp (вид packflow, ep04). До утверждения пакета текстов (T13) —
# только заглушки и нейтральные технические коды той же длины и структуры; демо-данные со снимков
# живут в docs/ep04-product-packapp/texts/packapp.md (Constitution 10).
kind: packflow
caption: "Пробный текст: подпись фигуры сценария упаковщика — стол, заказ и коробка, товар с кодом, этикетка, обратный скан и завершение."
app: "Пробный текст: приложение"
screen: "Пробный текст: экран"
panels: { log: "Пробный текст: журнал" }
station: { label: "Пробный текст: стол", code: "T-00" }
operator: "Пробный текст: роль"
steps:
  - "Пробный текст: шаг 1"
  - "Пробный текст: шаг 2"
  - "Пробный текст: шаг 3"
  - "Пробный текст: шаг 4"
  - "Пробный текст: шаг 5"
