  - step: 4
    prompt: "Пробный текст: подсказка 5"
    scan: { label: "Пробный текст: скан", value: "L-00000" }
    order: { label: "Пробный текст: заказ", code: "P-00000" }
    label: { template: "Пробный текст: шаблон", expected: "L-00000" }
    status: { label: "Пробный текст: совпало", tone: ok }
    progress: { done: 1, total: 5 }
    log: { time: "00:00:05", text: "Пробный текст: строка 5" }
  - step: 5
    prompt: "Пробный текст: подсказка 6"
    scan: { label: "Пробный текст: скан" }
    order: { label: "Пробный текст: заказ", code: "P-00000" }
