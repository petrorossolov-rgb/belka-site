  - step: 3
    prompt: "Пробный текст: подсказка 3"
    scan: { label: "Пробный текст: скан", value: "0000000000000" }
    order: { label: "Пробный текст: заказ", code: "P-00000" }
    item: { label: "Пробный текст: товар", code: "0000000000000" }
    mark: "(01)00000000000000(21)0000000AAAAAA"
    progress: { done: 1, total: 5 }
    log: { time: "00:00:03", text: "Пробный текст: строка 3" }
  - step: 4
    prompt: "Пробный текст: подсказка 4"
    scan: { label: "Пробный текст: скан" }
    order: { label: "Пробный текст: заказ", code: "P-00000" }
