# Гейты качества — единственное место с шагами проверок (Constitution 8).
# Вызывают ci.yml (push/PR) и deploy.yml (стейджинг, прод). Итог — задание
# gates-ok: именно оно required check для main, имя не меняется.
#
# Каждый вызов собирает production и прогоняет на ней полный набор: SEO-проверки
# и Lighthouse имеют смысл только там, staging намеренно отдаёт noindex. При
# site_env=staging тот же вызов дополнительно собирает staging в dist-staging/
# и проверяет её (check-dist-seo staging, lychee). Artifacts: dist-production,
# dist-staging (только при staging), draft-routes.json (черновые маршруты
# staging-сборки при site_env=staging, иначе прод-сборки — пустой список),
# .lighthouseci. Выкладка берёт только artifact своего окружения.
# Вход ref (SHA) задаёт промоушн в прод: он проверяет и собирает SHA со стейджинга,
# а не HEAD ветки, на которой запущен workflow.
name: gates

on:
  workflow_call:
    inputs:
      site_env:
        description: Окружение сборки — staging или production
        required: true
        type: string
      ref:
        description: Коммит для проверки (40 hex); пусто — коммит вызвавшего события. Промоушн в прод передаёт SHA со стейджинга
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  gates:
    name: gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Проверка входа site_env
        env:
          SITE_ENV: ${{ inputs.site_env }}
        run: |
          case "$SITE_ENV" in
            staging|production) ;;
            *) echo "::error::site_env: неизвестное значение «$SITE_ENV», допустимо: staging, production"; exit 1 ;;
          esac

      - name: Проверка входа ref
        env:
          REF: ${{ inputs.ref }}
        run: |
          if [[ -n "$REF" && ! "$REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::ref: ожидается пусто или SHA из 40 hex-символов, получено «$REF»"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Зависимости
        run: npm ci

      - name: Типы (astro check)
        run: npm run check

      - name: Тесты (vitest)
        run: npm test

      - name: shellcheck скриптов infra
        run: |
          shellcheck --version | head -2
          shellcheck infra/deploy/belka-deploy infra/deploy/tests/belka-deploy.test.sh \
            infra/deploy/ci-deploy.sh infra/deploy/smoke.sh             infra/certbot/renewal-hooks/deploy/belkascm-reload-nginx infra/monitor/check-site.sh

      - name: Тест обёртки деплоя
        run: bash infra/deploy/tests/belka-deploy.test.sh

      - name: Токены стилей (stylelint)
        run: npm run lint:css

      # --- production: полный набор ---

      - name: Сборка production
        env:
          SITE_ENV: production
        run: npm run build

      - name: check-dist-seo production
        run: node scripts/check-dist-seo.mjs production --dist dist --out draft-routes.json

      - name: Ссылки production (lychee)
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          lycheeVersion: v0.24.2
          args: --config lychee.toml --root-dir ${{ github.workspace }}/dist 'dist/**/*.html'
          fail: true
          failIfEmpty: true

      - name: Lighthouse CI — мобайл
        run: npm run lhci:mobile

      - name: Lighthouse CI — десктоп
        run: npm run lhci:desktop

      # Отчёты нужны и при упавшем Lighthouse — для разбора. Это не гейт, а его вывод.
      - name: Отчёты Lighthouse
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: .lighthouseci
          path: .lighthouseci/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

      # --- staging: дополнительная сборка и её проверки ---

      - name: Сборка staging
        if: inputs.site_env == 'staging'
        env:
          SITE_ENV: staging
        run: npm run build -- --outDir dist-staging

      - name: check-dist-seo staging
        if: inputs.site_env == 'staging'
        run: node scripts/check-dist-seo.mjs staging --dist dist-staging --out draft-routes.json

      - name: Ссылки staging (lychee)
        if: inputs.site_env == 'staging'
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          lycheeVersion: v0.24.2
          args: --config lychee.toml --root-dir ${{ github.workspace }}/dist-staging 'dist-staging/**/*.html'
          fail: true
          failIfEmpty: true

      # --- artifacts сборок (только после всех гейтов) ---

      - uses: actions/upload-artifact@v7
        with:
          name: dist-production
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - if: inputs.site_env == 'staging'
        uses: actions/upload-artifact@v7
        with:
          name: dist-staging
          path: dist-staging/
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v7
        with:
          name: draft-routes.json
          path: draft-routes.json
          if-no-files-found: error
          retention-days: 14

  # Итог гейтов. Задание без условия было бы пропущено при упавшем гейте, а
  # пропущенное задание GitHub засчитывает required check как успех. Поэтому
  # оно запускается всегда и само падает, если хоть одно задание не success
  # (в том числе failure, cancelled, skipped). Это не обход гейта, а его замок.
  gates-ok:
    name: gates-ok
    needs: [gates]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Все гейты зелёные
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -e 'to_entries | length > 0 and all(.value.result == "success")' > /dev/null || {
            echo "::error::Гейты не прошли:"
            echo "$NEEDS" | jq -r 'to_entries[] | "  \(.key): \(.value.result)"'
            exit 1
          }
