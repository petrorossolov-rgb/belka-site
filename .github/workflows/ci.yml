# Гейты на каждый push (кроме main) и на каждый PR. Проверка PR —
# required check `gates / gates-ok` для ветки main.
# site_env: staging — как у deploy.yml: кроме полного production-набора (с
# Lighthouse) проверяется и staging-сборка. Черновые секции есть только в ней,
# и без этого их голос и раскладку гейт впервые увидел бы после мержа.
name: ci

on:
  push:
    branches-ignore:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    uses: ./.github/workflows/gates.yml
    with:
      site_env: staging
