<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Только 1024</title>
<style>
body { margin: 0; font-family: sans-serif; }
.block { width: 100%; height: 40px; }
/* Проба ширины 1024 (ep03 T07): переполнение только между переломами 64rem и 70rem —
   на 360, 768 и 1440 страница чиста, гейт со старым списком ширин его не видит. */
@media (min-width: 64rem) and (max-width: 70rem) {
  .block { width: 1100px; }
}
</style>
</head>
<body>
<div class="block">только 1024</div>
</body>
</html>
