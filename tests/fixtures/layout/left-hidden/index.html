<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1px за левым краем в обёртке overflow-x: hidden</title>
<style>
body { margin: 0; font-family: sans-serif; }
.wrapper { width: 100%; overflow-x: hidden; }
.block { width: 200px; height: 40px; margin-left: -1px; }
</style>
</head>
<body>
<div class="wrapper"><div class="block">-1px</div></div>
</body>
</html>
