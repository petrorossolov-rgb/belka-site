<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Таблица в прокрутке</title>
<style>
body { margin: 0; font-family: sans-serif; }
.scroll { overflow-x: auto; }
table { width: 800px; border-collapse: collapse; }
</style>
</head>
<body>
<div class="scroll"><table><tr><td>Широкая таблица</td><td>800px</td></tr></table></div>
</body>
</html>
