<!doctype html>
<!--
  Шаблон OG-карточки 1200×630 для npm run build:og (scripts/build-og.mjs). Открывается через
  встроенный сервер с корнем в корне проекта: пути ниже — от корня, file:// шрифты не загрузит.
  Цвета и размеры — только токены темы (tokens/*.css, theme.css); шрифт, знак и словесный знак —
  те же файлы, что у сайта, без перекраски. Скрипт оставляет одну строку: слоган из site.yaml
  ([data-slogan]) или, с --product <id>, «name — descriptor» продукта ([data-product]).
-->
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>OG-карточка</title>
    <link rel="stylesheet" href="/src/styles/tokens/colors.css" />
    <link rel="stylesheet" href="/src/styles/tokens/typography.css" />
    <link rel="stylesheet" href="/src/styles/tokens/spacing.css" />
    <link rel="stylesheet" href="/src/styles/theme.css" />
    <style>
      /* Подмножества — как в astro.config.mjs: кириллица и латиница одного файла Onest. */
      @font-face {
        font-family: 'Onest OG';
        font-weight: 100 900;
        src: url('/src/assets/fonts/onest-cyrillic-wght-normal.woff2') format('woff2');
        unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
      }

      @font-face {
        font-family: 'Onest OG';
        font-weight: 100 900;
        src: url('/src/assets/fonts/onest-latin-wght-normal.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+2000-206F;
      }

      :root {
        --font-sans: 'Onest OG', sans-serif;
      }

      * {
        margin: 0;
        box-sizing: border-box;
      }

      body {
        width: var(--og-width);
        height: var(--og-height);
        overflow: hidden;
        font-family: var(--font-body);
      }

      .card {
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: var(--og-gap);
        width: var(--og-width);
        height: var(--og-height);
        padding: var(--og-padding);
        background: var(--color-plate-bg);
        color: var(--color-on-plate);
      }

      .card__lockup {
        display: flex;
        align-items: center;
        gap: calc(var(--og-logo-h) * var(--logo-lockup-gap-ratio));
      }

      .card__mark {
        display: block;
        height: var(--og-logo-h);
      }

      .card__wordmark {
        display: block;
        height: calc(var(--og-logo-h) * var(--logo-lockup-wordmark-ratio));
      }

      .card__slogan {
        color: var(--color-plate-accent);
        font-size: var(--og-slogan-size);
        font-weight: var(--font-weight-heavy);
        line-height: var(--leading-tight);
        letter-spacing: var(--letter-spacing-display);
      }

      /* На рыжей плашке — только крупный текст (соглашение contrast.test.ts). */
      .card__product {
        color: var(--color-plate-accent);
        font-size: var(--og-product-size);
        font-weight: var(--font-weight-heavy);
        line-height: var(--leading-tight);
        letter-spacing: var(--letter-spacing-display);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="card__lockup">
        <img class="card__mark" src="/src/assets/brand/mark-milk.png" alt="" />
        <img class="card__wordmark" src="/src/assets/brand/wordmark-latin-milk.png" alt="" />
      </div>
      <p class="card__slogan" data-slogan></p>
      <p class="card__product" data-product></p>
    </main>
  </body>
</html>
